name: Test Python research package
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q src scripts tests app.py
      - run: python -m pytest -q
      - name: Validate notebook schema
        run: python -c "import nbformat; n=nbformat.read('notebooks/01_olist_research.ipynb', as_version=4); nbformat.validate(n)"
